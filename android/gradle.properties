# Gradle / Android tuning for the PhotographerCamera build.
# Caches ON (build + configuration cache) — Gradle 9.6 + AGP 9.4 fully support
# them; second and later builds are dramatically faster.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=false
org.gradle.vfs.watch=false
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# AGP 8.9 rejects the system default JDK 25 — pin the Gradle JVM to JDK 17
# (user-space install, machine-specific like local.properties).
org.gradle.java.home=C:/Users/70898/jdks/jdk-17.0.20.1+1
# AGP 9 conservative migration: keep the legacy android{} DSL and the explicit
# Kotlin Gradle plugin (both officially supported in AGP 9, mandatory in AGP 10).
android.newDsl=false
android.builtInKotlin=false
