# Gradle / Android tuning for the PhotographerCamera build.
# Hardened for a constrained sandbox: lower concurrency + file-watch off to avoid
# the Gradle daemon being killed mid-build (native FS-watch crashes / memory spikes).
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.caching=false
org.gradle.parallel=false
org.gradle.vfs.watch=false
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
