<body data-page-node-id="snhwfdSUtC5BSQNg3Nv5Sr">

<header class="topbar" data-page-node-id="WcpYJRglUVpuWLMvpECfp8">

    <h2 data-page-node-id="lbFYrCoJVcRzft5sGTEXPQ">本地照片</h2>

    <div class="field" data-page-node-id="8v90Nm08OfKDaC9VRHPAGg">
      <div class="row" data-page-node-id="BQgzjnA4By1Bjnt4YGm7dx">

      </div>
      <input id="dirInput" type="file" webkitdirectory directory multiple hidden data-page-node-id="3CWdG7FChdB36e6fCrPojL">

      <div class="hint" data-page-node-id="QNN0S8fAm9DaJuWJGkoA49">照片仅载入浏览器内存，不上传任何服务器。支持 Mac / Windows 文件夹选择。</div>
    </div>

      <strong data-page-node-id="GsCzB0NtWvsUwaTSi6HeJK">拖拽照片到这里</strong>

    </div>

    </div>

  </aside>

    </div>

    <div id="stage" class="stage" data-page-node-id="Hss9AeZC7R9ejLiJEQRVzS">

      <div id="rendWrap" class="rend-wrap" data-page-node-id="78Dkvqhgd03jiEDMQRMOKZ">

      <div class="tag tag-r" data-page-node-id="iC8frTYNJWQ5E1QEU8xEnC">渲染后</div>

      <button id="btnImport" class="ghost wide" data-page-node-id="qMRlT2yb16E7aGAQ9VyJ1z">导入 Profile (JSON)</button>
      <input id="importInput" type="file" accept=".json,application/json" hidden data-page-node-id="wMEJ0KRSnpGBocW3EI9I0z">
      <div class="hint" data-page-node-id="R0AKb7ul3HkMtY2TNDrd40">选择一个已导出的 profile .json，载入后即可微调参数并重新保存。</div>
    </div>

    <div class="gen-box" data-page-node-id="A45IZ39YKLEtzHO2bRwFQH">
      <label data-page-node-id="i9aFXH8QlPj00joM5WZvj1">风格名称（导出显示名）</label>
      <input id="profileName" type="text" value="我的风格" spellcheck="false" data-page-node-id="7CvdcWcaP6BGuSNCG9ybGv">
      <label data-page-node-id="3JVuV3oRAT1VQuExc6oYAV">滤镜简介（可选）</label>
      <textarea id="profileIntro" rows="2" spellcheck="false" placeholder="一句话介绍，如：胶片感 · 暖调 · 适合街拍人像"></textarea>
      <button id="btnNew" class="primary wide" data-page-node-id="7oQzXRfU5ZLB1RQPiTQtde">新建空白 Profile</button>
    </div>

    <h2 data-page-node-id="CSDCjdG6mTgodx4UhGjcSD">风格参数</h2>
    <div id="ctrlBox" class="ctrl-box" data-page-node-id="4w5ixXmzV9tWsecvpEJn2Z">
      <div class="hint" data-page-node-id="XcoZxYEtJ7wdULlOGIRepS">尚未载入 Profile。点击上方「导入 Profile」或「新建空白 Profile」。</div>
    </div>

    <h2 data-page-node-id="OxYHwRsUPfzwZa11PsK8yo">导出</h2>
    <div class="export-box" data-page-node-id="sIVXx0KSPvPFivh1Z8Dvo0">
      <button id="btnSaveProfile" class="primary wide" data-page-node-id="csavDLHnJpCkIXFhgCKtq5">保存 Profile（.json 下载）</button>
      <button id="btnSave" class="ghost wide" data-page-node-id="SRHmfSHHEgZYlC195fi53t">保存 LUT（.cube，颜色层）</button>
      <button id="btnBatch" class="ghost wide" data-page-node-id="oHAuSVzbDzDG6dX7cZwain">批量渲染所选照片（PNG）</button>
      <button id="btnReset" class="ghost wide danger" data-page-node-id="hMlrWqhm9LOTinro3TiS3R">重置为载入值</button>

    <div class="hint" data-page-node-id="Sjs3oHh01CzbFbos5VQDQe">所有渲染在本地 GPU 完成；导出文件直接在浏览器下载，不经过服务器。</div>
  </aside>
